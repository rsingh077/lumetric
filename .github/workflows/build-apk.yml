name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'


      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug


      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v1.6.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v1.6.0-debug-apk
          path: Lumetric-v1.6.0.apk

      - name: Create or Update GitHub Release v1.6.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.6.0
          name: "Lumetric v1.6.0 — Loading Splash, Google/Gmail Server Auth & Executive Dashboard"
          body: |
            ### 🚀 Lumetric Mobile v1.6.0 Enterprise Release
            - **Loading / Splash Icon Screen**: Animated geometric 3D prism logo with live server handshake status.
            - **Dedicated Google / Gmail Sign-In & Registration**: Real server-validated authentication with credentials stored in Zoho Catalyst Crystal Datastore.
            - **Executive Dashboard Layout**: Faithful "Bonjour, Camille" UI overhaul with coral/rose accents, route progression (72%), entity status (Julien Morel / 78% capacity), and delivery performance (94%).
            - **Complete App Experience**: Interactive from Home through Data, Analysis, Models, Dashboards, and Settings with instant profile/session management.
            - **Direct Download**: Download `Lumetric-v1.6.0.apk` below.
          files: |
            Lumetric.apk
            Lumetric-v1.6.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
