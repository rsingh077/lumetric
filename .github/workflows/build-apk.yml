name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'


      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug


      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v1.2.0-debug-apk
          path: Lumetric.apk

      - name: Create or Update GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "Lumetric v1.2.0 — Crystal Database & Admin Role Governance"
          body: |
            ### 🚀 Lumetric Mobile v1.2.0 Release
            - **Crystal / Catalyst Data Store Persistence**: User profiles, credentials, settings, and sessions stored persistently.
            - **Admin Role & Profile Governance Dashboard**: Real-time permission elevation and role assignments (Owner, Admin, Builder, Reviewer, Viewer).
            - **Sliding Window IP Rate Limiting**: Enforced rate limits on authentication and registration endpoints.
            - **Seamless iOS & Android Mobile Shell**: iOS-style floating dock, haptics, and responsive layout.
            
            **Direct Download**: Download `Lumetric.apk` attached below or from repository root.
          files: Lumetric.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
