name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.3.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.3.0-debug-apk
          path: Lumetric-v2.3.0.apk

      - name: Create or Update GitHub Release v2.3.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.0
          name: "Lumetric v2.3.0 — Warm Ivory, Emerald Green & Vermilion Redesign with Live Lumi Cloud DataStore"
          body: |
            ### 🎨 Lumetric Mobile v2.3.0 Release

            #### 🏛️ Warm Ivory • Emerald Green • Vermilion Design System
            - **Warm Ivory Surface & Typography**: Natural warmth, editorial clarity, and soft high-contrast dark obsidian canvas.
            - **Emerald Green Primary Accents**: Jewel emerald buttons, active connection pulses, clean data health scores, and growth indicators.
            - **Vermilion Dynamic Focus**: Vivid vermilion highlights for alerts, active category filter pills, revenue trend curves, and high-energy CTAs.
            - **Harmonized Micro-Interactions**: Enhanced button states, responsive bottom navigation dock, and executive dashboard layout.

            #### 🗄️ Zoho Catalyst "Lumi" DataStore Fully Integrated
            - **Live Database Verified**: Connected directly to the authentic `Lumi` table (`Table ID: 83759000000013215`).
            - **Direct Schema Alignment**: Automatic support for all user columns (`email`, `passwordHash`, `name`, `role`, `organization`, `avatarUrl`, `mfaEnabled`, `settings`).
            - **End-to-End Persistence**: Sign-ups and logins write to and read from the Zoho Catalyst Cloud DataStore with zero mock fallbacks.

            #### 📱 Direct Download
            - **Direct APK Download (v2.3.0)**: [Lumetric-v2.3.0.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.0/Lumetric-v2.3.0.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.0/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
