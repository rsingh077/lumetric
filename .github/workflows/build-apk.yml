name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.0.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.0.1-debug-apk
          path: Lumetric-v2.0.1.apk

      - name: Create or Update GitHub Release v2.0.1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.1
          name: "Lumetric v2.0.1 — Resolved Android WebView Hydration & Rapid Splash Transition"
          body: |
            ### 🚀 Lumetric Mobile v2.0.1 Hotfix Release

            #### 🔧 Android WebView Hydration & Startup Fix
            - **Reconciled Turbopack Chunk Resolution**: Removed path conflicts between Android Capacitor and Next.js Turbopack chunk resolver.
            - **Native Asset Routing**: Android WebView loads clean root `/_next/` paths directly with zero chunk mismatches.
            - **Rapid Splash Screen Auto-Transition**: Enhanced `SplashScreen.tsx` with smooth 1-second auto-transition, responsive tap-anywhere dismiss, and touch fallback.

            #### 🔐 Enterprise Features & Real-Time Sync
            - **Two-Factor Authentication (2FA TOTP)**: Google Authenticator & 1Password support.
            - **Real-Time Fleet Telemetry**: Live vehicle metrics (`⚡ 82 km/h`), automated 1-click delay alert dispatch to SHA-256 ledger.
            - **AI Route Optimization**: 2-Opt TSP solver with downloadable manifest CSV.
            - **Offline-First Outbox**: Background synchronization buffer.

            #### 📱 Direct Download
            - **Direct APK Download (v2.0.1)**: [Lumetric-v2.0.1.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.1/Lumetric-v2.0.1.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.1/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
