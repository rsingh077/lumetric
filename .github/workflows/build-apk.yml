name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.2.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.2.0-debug-apk
          path: Lumetric-v2.2.0.apk

      - name: Create or Update GitHub Release v2.2.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0
          name: "Lumetric v2.2.0 — Real Authentication System, Dynamic Engine Metrics & Distance Data Purged"
          body: |
            ### 🚀 Lumetric Mobile v2.2.0 Release

            #### 🔐 Real Production Authentication System
            - **Removed Test Admin Bypasses**: Completely removed all fake 1-click test admin buttons and hardcoded persona shortcuts.
            - **Real Email + Password Authentication**: Direct integration with Zoho Catalyst Serverless Node.js backend using bcrypt password hashing and JWT sessions.
            - **Account Registration**: Create real user accounts with full names, work emails, passwords, organization names, and data governance roles.
            - **Google OAuth / SSO**: Fast authentication through Google accounts.
            - **Real User Identity**: User profiles display the authentic user's name, email, and avatar initials across the sidebar, header, and profile modal.

            #### 📊 Dynamic Engine Operations Card
            - **Purged Distance & KM Clutter**: Removed the legacy French delivery card ("Dernières courses 870 km").
            - **Real-Time Dynamic Metrics**: Sidebar now features live tabular record counts (`activeRows.length`), active document dossiers loaded, and tokens treated.
            - **Cloud Node Cluster Telemetry**: Real-time ping latency and online status connected to the Zoho Catalyst Cloud engine.

            #### 📱 Direct Download
            - **Direct APK Download (v2.2.0)**: [Lumetric-v2.2.0.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.0/Lumetric-v2.2.0.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.0/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
