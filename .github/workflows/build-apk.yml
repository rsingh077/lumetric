name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.3.3.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.3.3-debug-apk
          path: Lumetric-v2.3.3.apk

      - name: Create or Update GitHub Release v2.3.3
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.3
          name: "Lumetric v2.3.3 — Clean White-Label UI & Infrastructure Telemetry Purged"
          body: |
            ### 🛡️ Lumetric Mobile v2.3.3 Release

            #### 🏛️ Clean White-Label UI & Telemetry Purge
            - **Server Status Indicators Hidden**: All debug pills ("Server Live", latency ms, "Online 200 OK", and ping buttons) removed from header, sidebar, dashboard, and splash screen.
            - **Infrastructure Neutralization**: Removed all external vendor tags (Zoho Catalyst, Lumi DataStore, Crystal) from user-facing screens in favor of clean enterprise terminology ("Enterprise Cloud Data Vault", "Encrypted Cloud Storage").
            - **Polished Presentation**: Pristine header, clean profile controls, and distraction-free data analytics studio.

            #### 🏢 Multi-Tenant Profile Isolation
            - Every user profile operates strictly within their dedicated database sandbox.
            - Clean onboarding without mock data pollution.

            #### 📱 Direct Download
            - **Direct APK Download (v2.3.3)**: [Lumetric-v2.3.3.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.3/Lumetric-v2.3.3.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.3/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.3.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
