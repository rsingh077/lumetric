name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.2.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.2.2-debug-apk
          path: Lumetric-v2.2.2.apk

      - name: Create or Update GitHub Release v2.2.2
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.2
          name: "Lumetric v2.2.2 — Real Auth Enforcement, Instant Logout Fix, and Catalyst DataStore Verification"
          body: |
            ### 🚀 Lumetric Mobile v2.2.2 Release

            #### 🚪 Instant Session Logout Resolution
            - **Fixed Persistent Session Bug**: Profile modal "Sign Out" now properly triggers `AppContext.logout()`, immediately transitioning the application back to the login screen.
            - **Sidebar & Header Sign Out**: Added direct single-click "Sign Out" buttons in the sidebar footer and header user bar.
            - **Session Invalidation**: Clears tokens and cached state on logout across web and mobile.

            #### 🔐 Real Server Authentication Enforcement
            - **Purged Offline Mock Tokens**: Excised local mock fallback user generation (`usr_local_*`, `local_token_*`) from the authentication service.
            - **Real Server Verification**: Enforced 100% genuine backend verification against the live Zoho Catalyst Cloud Server (`project-rainfall`).
            - **Honest Connection Status**: Fixed telemetry health ping so failures accurately report disconnected status rather than pretending to be connected.

            #### 🗄️ Zoho Catalyst DataStore ("Crystal") Diagnostics
            - **Provisioning Status Endpoint**: Added `/api/datastore/status` to inspect whether the `Users` table exists in Catalyst DataStore.
            - **Dynamic Persistence Badge**: Replaced static "Synced" text with live verification status and setup instructions for Catalyst DataStore.

            #### 📱 Direct Download
            - **Direct APK Download (v2.2.2)**: [Lumetric-v2.2.2.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.2/Lumetric-v2.2.2.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.2/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
