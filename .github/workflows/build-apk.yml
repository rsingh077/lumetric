name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.1.0-debug-apk
          path: Lumetric-v2.1.0.apk

      - name: Create or Update GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "Lumetric v2.1.0 — Document Analysis Studio, Clean English Default & Multi-Language Settings"
          body: |
            ### 🚀 Lumetric Mobile v2.1.0 Release

            #### 📄 Document Analysis & NLP Treatments Studio
            - **Multi-Format Ingestion**: Ingest, parse, and analyze unstructured dossiers (PDF, DOCX, TXT, Markdown, JSON, CSV).
            - **Named Entity Recognition (NER)**: Automated classification of Organizations, Persons, Locations, Technical Terms, and Metrics.
            - **Automated PII Masking**: Quarantines and redacts sensitive identifiers (IPs, Tax IDs, Emails, Phone numbers) with cryptographic SHA-256 hashes.
            - **Readability & Complexity Scoring**: Flesch-Kincaid index, tokenization statistics, and executive summarization.
            - **Dossier Export**: 1-click JSON export of all parsed entities, treatments, and token statistics.

            #### 🌐 Localization & English Default
            - **Clean English Default**: Replaced all hardcoded French phrases across the dashboard, splash screen, navigation, and authentication screens with clean English data science terminology.
            - **Settings Language Switcher**: Added dynamic language preference support in Settings for English (Default), Français, Español, and Deutsch with persistent local storage.

            #### 🧹 Clean Data Science Domain Focus
            - **Removed Fleet & Logistics Clutter**: Completely purged irrelevant truck/cargo/distance telemetry data. The app is 100% focused on tabular data engineering and document analysis for data engineers and data scientists.
            - **1-Tap Data Scientist Access**: "⚡ Instant Access (Dr. Alexander Vance • Lead Data Scientist)" allows immediate one-click entry to the full studio.

            #### 📱 Direct Download
            - **Direct APK Download (v2.1.0)**: [Lumetric-v2.1.0.apk](https://github.com/rsingh077/lumetric/releases/download/v2.1.0/Lumetric-v2.1.0.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.1.0/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
