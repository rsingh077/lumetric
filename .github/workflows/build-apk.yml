name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'


      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug


      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v1.7.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v1.7.0-debug-apk
          path: Lumetric-v1.7.0.apk

      - name: Create or Update GitHub Release v1.7.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.7.0
          name: "Lumetric v1.7.0 — Executive Logistics & Analytics Dashboard, Fixed Splash & Catalyst Auth"
          body: |
            ### 🚀 Lumetric Mobile v1.7.0 Production Release
            - **Fixed Splash Transition**: Resolved splash loop bug using persistent ref callback, smoothly launching directly into Google / Gmail Auth or Studio Dashboard within 2 seconds.
            - **Executive Logistics & Analytics Dashboard**: Fully matching the reference layout:
              - *Bonjour, Camille* profile header and left navigation with coral-red active pill and bottom trip card (*32 courses, 870 km, 2h 45*).
              - *Progression globale (72%)* route map tracker with Paris -> Auxerre -> Dijon -> Lyon -> Marseille milestones.
              - *Détail de l'expédition*: Julien Morel (5 stars, 48 parcels, 68% loading dial, 5 860 € payment badge).
              - *Capacité du camion (78%)*: 3D cargo truck graphic with 14,2 t / 18,0 t weight indicators.
              - *Tendances des expéditions*: Red multi-point timeline curve across 7 days.
              - *Performance de livraison (94%)*: Solid coral/rose milestone card with wave sparkline.
              - *Donut chart (Répartition des envois)* & *Fuel consumption bar chart (128 L, -8%)*.
              - *Messages de l'équipe*: Live dispatch feed with unread indicators.
              - *Bottom CTA Banner*: "Gardez le contrôle de vos livraisons".
            - **Server Auth Validation**: Integrated with Zoho Catalyst Serverless (`lumetric_server`) & Crystal Datastore with Google / Gmail sign-in.
            - **Direct Download**: Download `Lumetric-v1.7.0.apk` below.
          files: |
            Lumetric.apk
            Lumetric-v1.7.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
