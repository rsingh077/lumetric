name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.2.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.2.1-debug-apk
          path: Lumetric-v2.2.1.apk

      - name: Create or Update GitHub Release v2.2.1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.1
          name: "Lumetric v2.2.1 — Database Profile Persistence, Bcrypt 12 Security Hardening & Zero Secrets Policy"
          body: |
            ### 🚀 Lumetric Mobile v2.2.1 Release

            #### 🛡️ Database Profile Persistence & Authentication
            - **Zoho Catalyst DataStore Persistence**: Real user profile creation and updates are persisted to the database (`Users` table) and cross-synced between web and Android mobile APK.
            - **Zero Hardcoded Passwords**: All mock test credentials, autofill shortcuts, and preloaded admin accounts completely removed from client UI and server runtime.
            - **High-Security Hashing**: Upgraded password hashing to 12-round salted Bcrypt (`bcrypt.genSalt(12)`).
            - **Strict Password Policy**: Minimum 8 characters with letter and number/special character complexity checks enforced.
            - **Password Change Endpoint**: Added authenticated `/api/user/change-password` allowing secure password updates directly from the user profile modal.

            #### 🔒 Enterprise Security Hardening & Leak Prevention
            - **Security Headers Middleware**: `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`, `Strict-Transport-Security`, and `Cache-Control: no-store`.
            - **ZCQL Sanitization**: Escaped single quotes across all database queries to prevent injection vulnerabilities.
            - **Repository Protection**: Strengthened `.gitignore` rules across root and subdirectories to block any `.env*`, keys, certificates, tokens, or credentials from being leaked.
            - **SECURITY.md**: Formally declared vulnerability reporting guidelines and data governance architecture.

            #### 📱 Direct Download
            - **Direct APK Download (v2.2.1)**: [Lumetric-v2.2.1.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.1/Lumetric-v2.2.1.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.2.1/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
