name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.0.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.0.0-debug-apk
          path: Lumetric-v2.0.0.apk

      - name: Create or Update GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "Lumetric v2.0.0 — Enterprise Fleet Analytics, 2FA, Real-Time Telemetry & AI Route Optimization"
          body: |
            ### 🚀 Lumetric Mobile v2.0.0 Milestone Release

            #### 🔐 Enterprise Security & 2FA Governance
            - **Two-Factor Authentication (2FA TOTP)**: Interactive QR code setup for Google Authenticator / 1Password via Zoho Catalyst with 6-digit TOTP verification.
            - **Column-Level RBAC Data Masking**: Sensitive financial figures (`ARR_USD`, billing rates) are masked for non-owner roles.
            - **Session Token Refresh**: Seamless session token renewal via `POST /api/auth/refresh`.

            #### 📡 Real-Time Fleet Telemetry & Event Automation
            - **Dynamic Telemetry Stream**: Live speed (km/h), fuel %, engine temperature, cargo load, and checkpoint progression streamed from Zoho Catalyst (`lumetric_server`).
            - **Automated Delay Alerting**: 1-click broadcast of route warnings anchored to the SHA-256 tamper-proof audit ledger.
            - **Certified Digital Invoicing**: Automated billing receipt generation with HMAC-SHA256 signatures.

            #### 📦 Offline-First Mobile Outbox Engine
            - **Local Outbox Synchronization**: `OfflineSyncManager` buffers parcel scans and status changes offline with zero data loss.
            - **Automatic Background Sync**: Auto-flushes pending actions when 4G/5G or Wi-Fi reconnects, with live visual indicator in header.

            #### 🗺️ AI Multi-Stop Route Optimizer & Predictive Forecasting
            - **Heuristic 2-Opt TSP Optimizer**: Solves French distribution hub route sequencing (Paris ➔ Auxerre ➔ Dijon ➔ Lyon ➔ Marseille), calculating -13.1% distance reduction, -37 L fuel savings, and 98 kg CO2 avoided.
            - **Route Manifest Download**: 1-click export of the optimized stop sequence in CSV format.
            - **30-Day Rolling Freight Forecast**: Bayesian demand curve with 95% confidence intervals and peak capacity surge alerts.

            #### 📱 Direct Download
            - **Direct APK Download (v2.0.0)**: [Lumetric-v2.0.0.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.0/Lumetric-v2.0.0.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.0/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
