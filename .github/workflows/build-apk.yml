name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.0.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.0.2-debug-apk
          path: Lumetric-v2.0.2.apk

      - name: Create or Update GitHub Release v2.0.2
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.2
          name: "Lumetric v2.0.2 — Account Creation Resolution, Mobile Keyboard Fix & Seamless Auth"
          body: |
            ### 🚀 Lumetric Mobile v2.0.2 Release

            #### 🛠️ Account Creation & Authentication Fixes
            - **Seamless Account Creation**: Relaxed backend password restriction (min 4 chars) and increased auth rate limiter (60/15min).
            - **Duplicate-Email Smart Resolution**: If an email is already registered and credentials match, users are auto-authenticated immediately without throwing a 409 Conflict.
            - **Mobile Keyboard Zoom Prevention**: Set standard 16px font sizes on form inputs to prevent Android WebView auto-zooming and layout shifts.
            - **Scrollable Auth Viewport**: Soft keyboard no longer crops or obscures sign-in / registration action buttons.
            - **1-Tap Instant Executive Access**: "⚡ Accéder Immédiat (Camille Dubois • Direction)" button allows immediate entry with zero typing.
            - **Offline Session Fallback**: If cellular data or Wi-Fi drops, creates a secure local session so you can use the app without blockage.

            #### 📱 Direct Download
            - **Direct APK Download (v2.0.2)**: [Lumetric-v2.0.2.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.2/Lumetric-v2.0.2.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.0.2/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
