name: Build Lumetric Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lumetric/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./lumetric
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        working-directory: ./lumetric
        run: npm run build:mobile

      - name: Build Debug APK with Gradle
        working-directory: ./lumetric/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root for Direct Repo Download
        run: |
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric.apk
          cp lumetric/android/app/build/outputs/apk/debug/app-debug.apk ./Lumetric-v2.3.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumetric-v2.3.2-debug-apk
          path: Lumetric-v2.3.2.apk

      - name: Create or Update GitHub Release v2.3.2
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.2
          name: "Lumetric v2.3.2 — Multi-Tenant Profile Isolation, Dedicated Database & Dynamic Analytics"
          body: |
            ### 🛡️ Lumetric Mobile v2.3.2 Release

            #### 🏢 Multi-Tenant Profile Separation & Isolated Storage
            - **Strict Individual Isolation**: Every user profile (`currentUser.email`) operates within a segregated database sandbox (`lumetric_profile_db_${sanitizedEmail}`). Datasets and document dossiers uploaded by one profile are completely invisible to others.
            - **Clean Workspace Onboarding**: Fresh profiles start with a clean workspace (no mock data pollution) with actionable shortcuts to upload files or opt-in to sample benchmarks.
            - **Dedicated Database & Files Manager**: Manage profile storage footprint in KB/MB, inspect ingested datasets, activate datasets, export JSON backups, and wipe data safely.

            #### 📊 Dynamic Analytics & Dynamic Metrics
            - **Eradicated Mock Defaults**: Tabular metrics (rows, ARR sum, NPS ratings, churn probability) compute dynamically from actual uploaded CSV data.
            - **Dynamic Curve Visualization**: Visualizes real trend data plotted from individual row values.
            - **Dynamic File Type Distribution**: Real-time breakdown of unstructured documents (PDF, DOCX, TXT).

            #### 📱 Direct Download
            - **Direct APK Download (v2.3.2)**: [Lumetric-v2.3.2.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.2/Lumetric-v2.3.2.apk)
            - **Direct APK Download (Latest)**: [Lumetric.apk](https://github.com/rsingh077/lumetric/releases/download/v2.3.2/Lumetric.apk)
          files: |
            Lumetric.apk
            Lumetric-v2.3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
